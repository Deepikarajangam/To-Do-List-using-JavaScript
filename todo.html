<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow - Todo Application</title>

    <link rel="stylesheet" href="todo.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header>
            <div class="logo">
                <span>✓</span> TaskFlow
            </div>

            <p>Organize your day. Get things done.</p>
        </header>


        <!-- Main Container -->
        <main>

            <div class="todo-card">

                <h1>My Tasks</h1>

                <p class="subtitle">
                    Keep track of everything you need to accomplish.
                </p>


                <!-- Add Task -->
                <div class="input-area">

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="What needs to be done?"
                    >

                    <button id="addBtn">
                        + Add Task
                    </button>

                </div>


                <!-- Filters -->
                <div class="filters">

                    <button class="filter active" data-filter="all">
                        All
                    </button>

                    <button class="filter" data-filter="active">
                        Active
                    </button>

                    <button class="filter" data-filter="completed">
                        Completed
                    </button>

                </div>


                <!-- Task List -->
                <ul id="taskList"></ul>


                <!-- Bottom Section -->
                <div class="bottom">

                    <span id="taskCount">
                        0 tasks left
                    </span>

                    <button id="clearCompleted">
                        Clear Completed
                    </button>

                </div>

            </div>

        </main>


        <!-- Footer -->
        <footer>

            <p>
                Created by <strong>Deepika R</strong>
                | Register No: <strong>212224040061</strong>
            </p>

            <p>
                © 2026 TaskFlow. All Rights Reserved.
            </p>

        </footer>

    </div>


    <script src="script.js"></script>

</body>
</html>
